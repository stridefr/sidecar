name: Release

# Fires on any tag matching v*.*.* — the trigger is the tag, not the commit,
# so "bump the version" and "publish a build" are the same action: tag it and
# push. electron-builder --publish always uploads the installer and
# latest.yml straight onto the matching GitHub Release, which is what
# electron-updater checks against.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match app/package.json version $PKG — refusing to publish a mismatched build."
            exit 1
          fi

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder can exit 0 having silently dropped an upload — v0.1.5
      # "succeeded" here with only the .blockmap on the release, no installer
      # and no latest.yml, which is exactly what electron-updater needs. Treat
      # that as the real failure it is instead of letting a green check mark
      # a broken release.
      - name: Verify the release actually has its assets
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSETS=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          echo "Assets on $TAG:"
          echo "$ASSETS"
          echo "$ASSETS" | grep -q "^latest\.yml$" || { echo "::error::latest.yml is missing from $TAG — electron-updater cannot see this release."; exit 1; }
          echo "$ASSETS" | grep -q "\.exe$" || { echo "::error::No installer .exe on $TAG."; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
