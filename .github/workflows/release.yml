name: Release

# Fires on any tag matching v*.*.* — the trigger is the tag, not the commit,
# so "bump the version" and "publish a build" are the same action: tag it and
# push. The installer and latest.yml (electron-updater's manifest) end up on
# the matching GitHub Release.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match app/package.json version $PKG — refusing to publish a mismatched build."
            exit 1
          fi

      # Build only — no publishing here. electron-builder's own GitHub
      # uploader silently dropped the .exe and latest.yml on two consecutive
      # releases (v0.1.5, v0.1.6): the tiny .blockmap always landed, the
      # 106MB installer and the manifest never did, with no error anywhere
      # in its log and a successful (0) exit code regardless. `npm run dist`
      # (this exact command) produced correct local artifacts on every one
      # of those runs — it's specifically electron-builder's uploader that's
      # unreliable for a file this size on a GitHub-hosted runner, not the
      # build itself.
      - name: Build
        run: npm run dist

      - name: List build artifacts
        shell: bash
        run: ls -la dist/

      # Uploading is handed to a purpose-built, widely-used action instead —
      # it retries and reports failures properly, which is exactly what was
      # missing.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          fail_on_unmatched_files: true
          files: |
            app/dist/*.exe
            app/dist/*.exe.blockmap
            app/dist/latest.yml

      # Belt-and-suspenders: confirm what actually landed, since this exact
      # class of "green build, broken release" is what caused this rewrite.
      - name: Verify the release actually has its assets
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSETS=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          echo "Assets on $TAG:"
          echo "$ASSETS"
          echo "$ASSETS" | grep -q "^latest\.yml$" || { echo "::error::latest.yml is missing from $TAG — electron-updater cannot see this release."; exit 1; }
          echo "$ASSETS" | grep -q "\.exe$" || { echo "::error::No installer .exe on $TAG."; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
