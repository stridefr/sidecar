<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'">
<title>Sidecar — prompt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="composer-win">
  <div class="composer">

    <div class="ctarget">
      <span class="g"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 8h10M8.5 4.5 12 8l-3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="lbl">Sending to</span>
      <span class="nm" id="c-name"><span class="hue-dot"></span><span id="c-name-text">No open session</span></span>
      <span class="sub marq" id="c-sub"></span>
      <button class="swap" id="c-swap">Change ⌥S</button>
      <button class="swap" id="c-close" title="Close (Esc)">✕</button>
    </div>

    <div class="dropdown" id="c-drop">
      <input class="dsearch" id="c-search" placeholder="Filter open sessions…">
      <div id="c-drop-list"></div>
    </div>

    <div class="cbody">
      <textarea id="ta" rows="1" placeholder="Type a prompt, paste a screenshot, or dictate…"></textarea>
      <div class="shots" id="shots"></div>
    </div>

    <div class="err" id="c-err" style="display:none"></div>

    <div class="cfoot">
      <button class="chip" id="c-mic" title="Dictate">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="5.5" y="2" width="5" height="8" rx="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span id="c-mic-label">Dictate</span>
      </button>
      <span class="sp"></span>
      <span class="kbd" title="Shift+Enter is a best-effort queue — not confirmed against the extension">⇧↵ queue?</span>
      <button class="btn" id="c-send">Send <span class="k">↵</span></button>
    </div>
  </div>

<script src="motion.js"></script>
<script src="dictation.js"></script>
<script src="marquee.js"></script>
<script src="composer.js"></script>
</body>
</html>
